<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="font-weight:bold">Method</span>
<button id="mSingle" class="active" style="width:100%;white-space:normal" onclick="setMethod('single')">Single observer (height + horizon)</button>
<button id="mTri" style="width:100%;white-space:normal" onclick="setMethod('tri')">Two observers (triangulation)</button>
<label id="hLab">Observer height h above water: <output id="observerHeightVal">60</output> m<input id="observerHeightInput" type="range" min="10" max="120" step="1" value="60" oninput="document.getElementById('observerHeightVal').value=this.value;update_observerHeight(+this.value)"></label>
<label id="tLab" style="opacity:.45">Observer separation t (baseline): <output id="baselineSeparationVal">40</output> m<input id="baselineSeparationInput" type="range" min="5" max="100" step="1" value="40" oninput="document.getElementById('baselineSeparationVal').value=this.value;update_baselineSeparation(+this.value)"></label>
<span style="font-size:10px;color:#666">Sighting angles carry a ±0.4° measurement error.</span>
<p id="demoNarration" style="margin:0;font-size:10px;max-width:180px"></p>
<span><button onclick="prevStep()">◀</button> <span id="stepLabel"></span> <button onclick="nextStep()">▶</button></span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
var VW = 900, VH = 640;
var WATER_Y = 320, MAST_X = 200, BOAT_X = 640, BOAT_Y = 316;
var SCALE = 2.2;            // px per metre
var SIGMA = 0.4;            // angular measurement error, degrees
var D_TRUE = (BOAT_X - MAST_X) / SCALE;   // 200 m

var state = { method: 'single', h: 60, t: 40 };
var curStep = 0;

var draw = SVG().addTo(document.getElementById('container')).size('100%', '100%');
draw.viewbox(0, 0, VW, VH);

/* ── angle helpers (degrees, screen coords: +y down) ───────────────────── */
function rad(d) { return d * Math.PI / 180; }
function cosd(d) { return Math.cos(rad(d)); }
function sind(d) { return Math.sin(rad(d)); }
function atan2d(dy, dx) { return Math.atan2(dy, dx) * 180 / Math.PI; }
function arcD(cx, cy, r, a0, a1) {
  return 'M' + (cx + r * cosd(a0)) + ' ' + (cy + r * sind(a0)) +
    ' A' + r + ' ' + r + ' 0 0 1 ' + (cx + r * cosd(a1)) + ' ' + (cy + r * sind(a1));
}
function rayInt(o1, a1, o2, a2) {
  var d1x = cosd(a1), d1y = sind(a1), d2x = cosd(a2), d2y = sind(a2);
  var den = d1x * d2y - d1y * d2x;
  if (Math.abs(den) < 1e-9) return null;
  var s = ((o2.x - o1.x) * d2y - (o2.y - o1.y) * d2x) / den;
  return { x: o1.x + s * d1x, y: o1.y + s * d1y, s: s };
}
function interactive(el, tip, title, body) {
  el.css('cursor', 'pointer');
  el.on('mousemove', function (e) { showTooltip(tip, e); })
    .on('mouseleave', function () { hideTooltip(); })
    .on('click', function () { showPopup(title, body); });
}

/* ── static scene ──────────────────────────────────────────────────────── */
draw.rect(VW, VH).fill('#ffffff');                                   // sky
draw.rect(VW, VH - WATER_Y).move(0, WATER_Y).fill('#5fefc9');        // water
var terrain = draw.path(
  'M 0,340 C 30,300 70,270 110,258 C 130,252 145,255 152,262 ' +
  'C 170,275 195,300 215,320 C 260,360 300,430 360,500 ' +
  'C 420,565 520,610 640,630 C 700,638 760,640 800,640 L 0,640 Z')
  .fill('#b06f00').stroke({ color: '#8a5a00', width: 1.5 });
interactive(terrain, 'Coastal cliff and beach', 'The vantage point',
  'The observer stands on a mast of known height h at the water\'s edge. In triangulation mode a second observer joins on the same mast, separated by a known baseline t.');
draw.line(215, WATER_Y, VW, WATER_Y).stroke({ color: '#1c1c1c', width: 3 });  // horizon

// readout panel (static frame, dynamic text)
draw.rect(338, 112).move(548, 14).radius(6).fill('#ffffff').opacity(0.9)
  .stroke({ color: '#8a8a8a', width: 1 });

// sailboat
var boat = draw.group().translate(BOAT_X, WATER_Y - 2);
boat.rect(64, 72).move(-32, -60).fill('#ffffff').opacity(0);          // hit area
boat.path('M -24,-6 L 24,-6 Q 20,8 0,10 Q -20,8 -24,-6 Z')
  .fill('#ffffff').stroke({ color: '#1c1c1c', width: 3, linejoin: 'round' });
boat.line(0, -6, 0, -52).stroke({ color: '#1c1c1c', width: 3 });
boat.path('M 2,-50 L 2,-12 L 26,-12 Q 14,-30 2,-50 Z')
  .fill('#ffffff').stroke({ color: '#1c1c1c', width: 3, linejoin: 'round' });
boat.path('M -2,-48 L -2,-12 L -22,-12 Q -12,-32 -2,-48 Z')
  .fill('#ffffff').stroke({ color: '#1c1c1c', width: 3, linejoin: 'round' });
interactive(boat, 'Boat — its distance d is unknown', 'The unknown distance d',
  'The boat is never ranged directly. Single observer: d = h / tan α from the known height and the dip angle. Two observers: d comes from intersecting two sight lines a known baseline t apart. Both are pure geometry — the same principle behind stereo depth.');

var gDyn = draw.group();

function mkText(str, x, y, o) {
  o = o || {};
  var t = gDyn.text(String(str));
  t.font({ family: o.serif ? 'Georgia, serif' : 'sans-serif', size: o.size || 14, anchor: o.anchor || 'start' });
  if (o.italic) t.attr('font-style', 'italic');
  if (o.bold) t.attr('font-weight', 'bold');
  t.fill(o.fill || '#111111');
  if (o.halo !== 0) t.attr({ 'paint-order': 'stroke', stroke: '#ffffff', 'stroke-width': 4, 'stroke-linejoin': 'round' });
  t.move(x, y);
  return t;
}
function seg(x1, y1, x2, y2, color, w, dash) {
  var ln = gDyn.line(x1, y1, x2, y2).stroke({ color: color, width: w, linecap: 'round' });
  if (dash) ln.attr('stroke-dasharray', dash);
  return ln;
}
function readout(lines) {
  for (var i = 0; i < lines.length; i++) {
    mkText(lines[i].s, 560, 34 + i * 20, { size: 13.5, bold: !!lines[i].b, halo: 0, fill: '#222' });
  }
}

/* ── single-observer mode ──────────────────────────────────────────────── */
function renderSingle() {
  var hPx = SCALE * state.h, oy = WATER_Y - hPx;
  var alpha = atan2d(BOAT_Y - oy, BOAT_X - MAST_X);
  var alphaM = alpha + SIGMA;
  var dEst = state.h / Math.tan(rad(alphaM));

  gDyn.rect(18, hPx).move(MAST_X - 9, oy).fill('#4a2c00').opacity(0.45); // shaded band
  var mast = gDyn.rect(5, hPx).move(MAST_X - 2.5, oy).fill('#1c1c1c');
  interactive(mast, 'Known height h above the water', 'Known height h',
    'The vertical mast is the known side of a right triangle: height h above the water. With the dip angle α to the boat, d = h / tan α. If h is measured badly, every distance inherits that error.');
  gDyn.rect(16, 16).move(MAST_X + 3, WATER_Y - 16).fill('#cfcfcf').stroke({ color: '#333333', width: 2 });

  seg(MAST_X, oy, 536, oy, '#1c1c1c', 2.5);                       // sight to horizon
  seg(MAST_X, oy, BOAT_X - 6, BOAT_Y, '#1c1c1c', 2.5);            // sight to boat

  var arc = gDyn.path(arcD(MAST_X, oy, 56, 0, alpha)).fill('none').stroke({ color: '#1c1c1c', width: 2 });
  interactive(arc, 'Dip angle α (measured)', 'Dip angle α',
    'α is the angle below the horizontal horizon line at which the boat appears. With a ±0.4° measurement error the estimate d = h / tan α is only approximate — notice the readout error grow when h (and so α) is small.');

  var obs = gDyn.circle(24).center(MAST_X, oy).fill('#ffffff').stroke({ color: '#1c1c1c', width: 3.5 });
  interactive(obs, 'Observer at height h', 'One observer, known height',
    'The observer sights the horizon and the boat. The known height h plus the dip angle α fix a right triangle, so the distance d = h / tan α follows from trigonometry alone.');

  mkText('α', MAST_X + 82 * cosd(alpha / 2), oy + 82 * sind(alpha / 2) + 2, { serif: 1, italic: 1, size: 24 });
  mkText('h', MAST_X - 16, (oy + WATER_Y) / 2 + 7, { serif: 1, italic: 1, size: 24, anchor: 'end' });
  mkText('d?', 418, WATER_Y + 32, { serif: 1, italic: 1, size: 28 });

  readout([
    { s: 'Single observer · height h = ' + state.h + ' m', b: 1 },
    { s: 'dip angle α = ' + alpha.toFixed(1) + '°  (measured ' + alphaM.toFixed(1) + '°)' },
    { s: 'd = h / tan α  ≈  ' + Math.round(dEst) + ' m    (true d = ' + Math.round(D_TRUE) + ' m)' },
    { s: 'error ≈ ' + Math.abs(Math.round(dEst - D_TRUE)) + ' m  from the ±' + SIGMA + '° angle error' }
  ]);
}

/* ── two-observer triangulation ────────────────────────────────────────── */
function renderTri() {
  var o1 = { x: MAST_X, y: 64 };
  var o2 = { x: MAST_X, y: 64 + SCALE * state.t };
  var a1 = atan2d(BOAT_Y - o1.y, BOAT_X - o1.x);
  var a2 = atan2d(BOAT_Y - o2.y, BOAT_X - o2.x);
  var alpha = 90 - a1, beta = 90 - a2, par = beta - alpha;
  var alphaM = alpha + SIGMA, betaM = beta - SIGMA;
  var r1 = a1 - SIGMA, r2 = a2 + SIGMA;          // measured ray directions
  var hit = rayInt(o1, r1, o2, r2);

  var mast = gDyn.rect(5, WATER_Y - 56).move(MAST_X - 2.5, 56).fill('#1c1c1c');
  interactive(mast, 'Observation mast', 'Two observers, one mast',
    'Both observers stand on the same structure, separated by a surveyed baseline t. Each sights the boat; the two sight lines and the baseline form a triangle that determines d.');
  var base = seg(o1.x, o1.y, o2.x, o2.y, '#ffd27a', 8);
  interactive(base, 'Known baseline t', 'The baseline t',
    'The separation t is the only length that must be known. The parallax angle β − α grows with t; as t shrinks the sight lines become nearly parallel and the fix on d collapses — exactly why stereo depth fails for distant objects.');

  seg(o1.x, o1.y, BOAT_X - 6, BOAT_Y, '#1c1c1c', 2.5);   // true sight lines
  seg(o2.x, o2.y, BOAT_X - 6, BOAT_Y, '#1c1c1c', 2.5);

  // measured (erroneous) rays
  var len1 = hit ? Math.max(0, Math.min(hit.s, 780)) : 780;
  var e1 = { x: o1.x + len1 * cosd(r1), y: o1.y + len1 * sind(r1) };
  seg(o1.x, o1.y, e1.x, e1.y, '#c0392b', 2, '6,5');
  var len2 = hit ? Math.max(0, Math.min(Math.hypot(hit.x - o2.x, hit.y - o2.y), 780)) : 780;
  var e2 = { x: o2.x + len2 * cosd(r2), y: o2.y + len2 * sind(r2) };
  seg(o2.x, o2.y, e2.x, e2.y, '#c0392b', 2, '6,5');

  var onScreen = hit && hit.s > 0 && hit.s <= 780 && hit.x <= 890 && hit.y <= 632;
  if (onScreen) {
    var x1 = seg(hit.x - 9, hit.y - 9, hit.x + 9, hit.y + 9, '#c0392b', 3);
    var x2 = seg(hit.x - 9, hit.y + 9, hit.x + 9, hit.y - 9, '#c0392b', 3);
    interactive(x1, 'Estimated boat position', 'Estimated position',
      'The dashed rays are drawn with a ±0.4° measurement error; where they cross is the estimated boat position. Its offset from the real boat is the distance error — shrink t and watch the crossing fly away.');
    interactive(x2, 'Estimated boat position', 'Estimated position',
      'The dashed rays are drawn with a ±0.4° measurement error; where they cross is the estimated boat position. Its offset from the real boat is the distance error — shrink t and watch the crossing fly away.');
  } else {
    var d1 = gDyn.circle(8).center(e1.x, e1.y).fill('#c0392b');
    var d2 = gDyn.circle(8).center(e2.x, e2.y).fill('#c0392b');
    interactive(d1, 'Rays still have not met', 'Fix lost',
      'With such a small baseline the measured rays are nearly parallel: their intersection lies far beyond the view. Tiny angle errors now produce enormous distance errors — the estimate is worthless.');
    interactive(d2, 'Rays still have not met', 'Fix lost',
      'With such a small baseline the measured rays are nearly parallel: their intersection lies far beyond the view. Tiny angle errors now produce enormous distance errors — the estimate is worthless.');
  }

  gDyn.path(arcD(o1.x, o1.y, 50, a1, 90)).fill('none').stroke({ color: '#1c1c1c', width: 2 });
  gDyn.path(arcD(o2.x, o2.y, 44, a2, 90)).fill('none').stroke({ color: '#1c1c1c', width: 2 });

  var c1 = gDyn.circle(24).center(o1.x, o1.y).fill('#ffffff').stroke({ color: '#1c1c1c', width: 3.5 });
  var c2 = gDyn.circle(24).center(o2.x, o2.y).fill('#ffffff').stroke({ color: '#1c1c1c', width: 3.5 });
  interactive(c1, 'Upper observer — angle α', 'Two observers triangulate',
    'Each observer sights the same boat. Baseline t plus angles α and β fully determine the triangle, so d follows without any horizon reference — the same principle as stereo vision with two eyes.');
  interactive(c2, 'Lower observer — angle β', 'Two observers triangulate',
    'Each observer sights the same boat. Baseline t plus angles α and β fully determine the triangle, so d follows without any horizon reference — the same principle as stereo vision with two eyes.');

  mkText('α', o1.x + 70 * cosd((a1 + 90) / 2), o1.y + 70 * sind((a1 + 90) / 2) + 2, { serif: 1, italic: 1, size: 24 });
  mkText('β', o2.x + 62 * cosd((a2 + 90) / 2), o2.y + 62 * sind((a2 + 90) / 2) + 2, { serif: 1, italic: 1, size: 24 });
  mkText('t', MAST_X - 16, (o1.y + o2.y) / 2 + 7, { serif: 1, italic: 1, size: 24, anchor: 'end' });
  mkText('d?', 418, WATER_Y + 32, { serif: 1, italic: 1, size: 28 });

  var dEst = (hit && hit.s > 0) ? (hit.x - MAST_X) / SCALE : NaN;
  readout([
    { s: 'Two observers · baseline t = ' + state.t + ' m', b: 1 },
    { s: 'α = ' + alpha.toFixed(1) + '°   β = ' + beta.toFixed(1) + '°   →   parallax β−α = ' + par.toFixed(1) + '°' },
    { s: onScreen ? ('d ≈ ' + Math.round(dEst) + ' m    (true d = ' + Math.round(D_TRUE) + ' m, error ' + Math.abs(Math.round(dEst - D_TRUE)) + ' m)') : 'd unreliable — measured rays do not converge in view' },
    { s: 'smaller t ⇒ parallax → 0 ⇒ error explodes (stereo limit)' }
  ]);
}

function render() {
  gDyn.clear();
  if (state.method === 'single') renderSingle(); else renderTri();
}

/* ── controls ──────────────────────────────────────────────────────────── */
function setMethod(m) {
  state.method = m;
  document.getElementById('mSingle').classList.toggle('active', m === 'single');
  document.getElementById('mTri').classList.toggle('active', m === 'tri');
  document.getElementById('observerHeightInput').disabled = (m !== 'single');
  document.getElementById('baselineSeparationInput').disabled = (m !== 'tri');
  document.getElementById('hLab').style.opacity = (m === 'single') ? 1 : 0.45;
  document.getElementById('tLab').style.opacity = (m === 'tri') ? 1 : 0.45;
  render();
}
function update_observerHeight(v) { state.h = v; if (state.method === 'single') render(); }
function update_baselineSeparation(v) { state.t = v; if (state.method === 'tri') render(); }

/* ── demo steps ────────────────────────────────────────────────────────── */
var steps = [
  { title: 'One observer, known height', narration: 'Standing at height h above the water, the observer measures the dip angle α between the horizon and the boat. Together with h this fixes a right triangle, so d follows from trigonometry alone.', state: { methodView: 'Single observer (height + horizon)', observerHeight: 60 } },
  { title: 'Height changes the estimate', narration: 'Drag the height slider: for the same measured angle α, a taller vantage point implies a larger distance d. The horizon reference only yields distance because h is known.', state: { methodView: 'Single observer (height + horizon)', observerHeight: 110 } },
  { title: 'Two observers triangulate', narration: 'Switch methods: now two observers separated by a known baseline t each sight the boat, measuring angles α and β. The boat sits at the intersection of the two sight lines — no horizon reference needed.', state: { methodView: 'Two observers (triangulation)', baselineSeparation: 40 } },
  { title: 'Baseline controls reliability', narration: 'Shrink the separation t toward zero: the two sight lines become nearly parallel and the intersection point — hence d — becomes extremely sensitive to tiny angle errors. A wide baseline gives a well-conditioned fix, just like the separation between two eyes or cameras in stereo vision.', state: { methodView: 'Two observers (triangulation)', baselineSeparation: 10 } }
];
function applyStep(i) {
  curStep = Math.max(0, Math.min(steps.length - 1, i));
  var s = steps[curStep].state;
  if (s.methodView) setMethod(s.methodView.indexOf('Single') === 0 ? 'single' : 'tri');
  if (s.observerHeight != null) {
    document.getElementById('observerHeightInput').value = s.observerHeight;
    document.getElementById('observerHeightVal').value = s.observerHeight;
    state.h = s.observerHeight;
  }
  if (s.baselineSeparation != null) {
    document.getElementById('baselineSeparationInput').value = s.baselineSeparation;
    document.getElementById('baselineSeparationVal').value = s.baselineSeparation;
    state.t = s.baselineSeparation;
  }
  render();
  document.getElementById('demoNarration').textContent = steps[curStep].title + ' — ' + steps[curStep].narration;
  document.getElementById('stepLabel').textContent = 'Step ' + (curStep + 1) + ' of ' + steps.length;
}
function nextStep() { applyStep(curStep + 1); }
function prevStep() { applyStep(curStep - 1); }

/* ── init ──────────────────────────────────────────────────────────────── */
setMethod('single');
applyStep(0);
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
