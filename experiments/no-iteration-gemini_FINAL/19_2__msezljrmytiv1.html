<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<div style="padding: 4px;">
  <label style="font-weight:bold; margin-bottom: 6px; font-size: 13px;">Heap representation</label>
  <label style="cursor: pointer; display: flex; align-items: center; gap: 4px; margin-bottom: 4px;">
    <input type="radio" name="viewToggle" id="viewToggle_abs" value="Abstract tree" checked onchange="updateView()"> 
    Abstract tree
  </label>
  <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
    <input type="radio" name="viewToggle" id="viewToggle_exp" value="Explicit pointers" onchange="updateView()"> 
    Explicit pointers
  </label>
  
  <div style="margin: 14px 0; height: 1px; background: #dcdfe3;"></div>
  
  <label style="font-weight:bold; margin-bottom: 6px; font-size: 13px;">FIB-HEAP-INSERT(H, 2)</label>
  <input id="insertSequenceInput" type="range" min="0" max="3" step="1" value="0" oninput="updateInsert(+this.value)" style="width: 100%; cursor: pointer;">
  <div style="display:flex; justify-content:space-between; font-size:10px; color:#555; font-family: monospace;">
    <span>idle</span>
    <span>create</span>
    <span>splice</span>
    <span>update</span>
  </div>

  <div id="demoSteps" style="margin-top: 20px; background:#f4f6f9; padding:12px; border-radius:6px; border: 1px solid #c9d0d8;">
    <p id="demoNarration" style="margin:0 0 12px 0; font-size:12px; line-height:1.45; color:#222; min-height: 52px;"></p>
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <button onclick="prevStep()" id="prevBtn" style="padding:4px 10px; font-size: 12px;">◀ Prev</button>
      <span id="stepLabel" style="font-weight:bold; font-size: 11px; color: #555;">Step 1 / 5</span>
      <button onclick="nextStep()" id="nextBtn" style="padding:4px 10px; font-size: 12px;">Next ▶</button>
    </div>
  </div>
</div>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
const W = 900;
const H = 420;
const draw = SVG().addTo('#container').size('100%', '100%').viewbox(0, 0, W, H);

// Define markers for arrows
const defs = draw.defs();
const arrowMarker = defs.marker(10, 8, function(add) {
    add.path('M0,0 L10,4 L0,8 Z').fill('#222');
}).ref(9, 4);
const redArrowMarker = defs.marker(10, 8, function(add) {
    add.path('M0,0 L10,4 L0,8 Z').fill('#d90000');
}).ref(9, 4);

// Data structure representing the heap's nodes
const nodesData = {
    '23': {x: 80, y: 150, marked: false},
    '7':  {x: 180, y: 150, marked: false},
    '2':  {x: 280, y: 150, marked: false}, // Dynamically inserted
    '3':  {x: 390, y: 150, marked: false},
    '17': {x: 580, y: 150, marked: false},
    '24': {x: 770, y: 150, marked: false},
    '18': {x: 310, y: 245, marked: true},
    '52': {x: 390, y: 245, marked: false},
    '38': {x: 470, y: 245, marked: false},
    '39': {x: 310, y: 340, marked: true},
    '41': {x: 470, y: 340, marked: false},
    '30': {x: 580, y: 245, marked: false},
    '26': {x: 720, y: 245, marked: true},
    '46': {x: 820, y: 245, marked: false},
    '35': {x: 720, y: 340, marked: false}
};

const treeEdges = [
    {p: '3', c: ['18','52','38']},
    {p: '18', c: ['39']},
    {p: '38', c: ['41']},
    {p: '17', c: ['30']},
    {p: '24', c: ['26','46']},
    {p: '26', c: ['35']}
];

const rootsIdle = ['23', '7', '3', '17', '24'];
const rootsInserted = ['23', '7', '2', '3', '17', '24'];

// SVG Layers
const abstractGroup = draw.group();
const explicitGroup = draw.group().opacity(0); // Hidden by default
const explicitBaseGroup = explicitGroup.group();
const explicitRootsIdleGroup = explicitGroup.group();
const explicitRootsInsertedGroup = explicitGroup.group().opacity(0);
const highlightGroup = draw.group();
const nodesRenderGroup = draw.group();

// Helper: Calculate edge coordinates touching node circles (radius 16)
function getEdgeCoords(x1, y1, x2, y2, offset1 = 16, offset2 = 18) {
    let dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx*dx + dy*dy);
    if (len === 0) return [x1, y1, x2, y2];
    let nx = dx/len, ny = dy/len;
    return [x1 + nx*offset1, y1 + ny*offset1, x2 - nx*offset2, y2 - ny*offset2];
}

// ─── DRAW ABSTRACT VIEW ────────────────────────────────────────────────────────
const abstractRootsIdleLine = abstractGroup.line(80, 150, 770, 150).stroke({width: 1.5, color: '#333', dasharray: '6,6'});
const abstractRootsInsertedLine = abstractGroup.line(80, 150, 770, 150).stroke({width: 1.5, color: '#333', dasharray: '6,6'}).opacity(0);

treeEdges.forEach(edge => {
    let P = nodesData[edge.p];
    edge.c.forEach(cid => {
        let C = nodesData[cid];
        let [x1, y1, x2, y2] = getEdgeCoords(P.x, P.y, C.x, C.y, 16, 16);
        abstractGroup.line(x1, y1, x2, y2).stroke({width: 1.5, color: '#333'});
    });
});

// ─── DRAW EXPLICIT POINTERS VIEW ─────────────────────────────────────────────
function drawSiblings(g, list, isRootList = false) {
    if (list.length === 0) return;
    const r = 16, offset = 4;
    const y = nodesData[list[0]].y;
    
    let minX = Math.min(...list.map(id => nodesData[id].x));
    let maxX = Math.max(...list.map(id => nodesData[id].x));
    
    // Elongated Pill Shape
    g.rect(maxX - minX + 64, 52).cx((minX+maxX)/2).cy(y).radius(14).fill('none').stroke({width:1.2, color:'#555'});
    
    if (list.length === 1) {
        // Self loops for singletons
        let cx = minX;
        g.path(`M ${cx-8} ${y-15} C ${cx-24} ${y-24}, ${cx-24} ${y+24}, ${cx-8} ${y+15}`).fill('none').stroke({width:1, color:'#222'}).marker('end', arrowMarker);
        g.path(`M ${cx+8} ${y+15} C ${cx+24} ${y+24}, ${cx+24} ${y-24}, ${cx+8} ${y-15}`).fill('none').stroke({width:1, color:'#222'}).marker('end', arrowMarker);
        return;
    }
    
    // Bidirectional adjacent arrows
    for(let i=0; i<list.length-1; i++) {
        let n1 = nodesData[list[i]], n2 = nodesData[list[i+1]];
        g.line(n1.x+r, n1.y-offset, n2.x-r-2, n2.y-offset).stroke({width:1, color:'#222'}).marker('end', arrowMarker);
        g.line(n2.x-r, n2.y+offset, n1.x+r+2, n1.y+offset).stroke({width:1, color:'#222'}).marker('end', arrowMarker);
    }
    
    // Wrap-around circular arrows
    let L = nodesData[list[0]], R = nodesData[list[list.length-1]];
    let ry = 20; // curve control height
    
    // Top wrap (Right to Left)
    g.path(`M ${R.x+12} ${y-10} Q ${R.x+26} ${y-ry} ${R.x} ${y-ry} L ${L.x} ${y-ry} Q ${L.x-26} ${y-ry} ${L.x-12} ${y-10}`)
     .fill('none').stroke({width:1, color:'#222'}).marker('end', arrowMarker);
     
    // Bottom wrap (Left to Right)
    g.path(`M ${L.x-12} ${y+10} Q ${L.x-26} ${y+ry} ${L.x} ${y+ry} L ${R.x} ${y+ry} Q ${R.x+26} ${y+ry} ${R.x+12} ${y+10}`)
     .fill('none').stroke({width:1, color:'#222'}).marker('end', arrowMarker);
}

function drawParentChild(g, P_id, childrenIds) {
    let P = nodesData[P_id];
    let firstC = nodesData[childrenIds[0]];
    
    // Parent down to First Child
    let childLineOffset = (Math.abs(P.x - firstC.x) < 5) ? -4 : 0;
    let [px, py, cx, cy] = getEdgeCoords(P.x + childLineOffset, P.y, firstC.x + childLineOffset, firstC.y, 16, 18);
    g.line(px, py, cx, cy).stroke({width:1, color:'#222'}).marker('end', arrowMarker);
    
    // All Children up to Parent
    childrenIds.forEach(cid => {
        let C = nodesData[cid];
        let pLineOffset = (Math.abs(P.x - C.x) < 5) ? 4 : 0;
        let [cx2, cy2, px2, py2] = getEdgeCoords(C.x + pLineOffset, C.y, P.x + pLineOffset, P.y, 16, 18);
        g.line(cx2, cy2, px2, py2).stroke({width:1, color:'#222'}).marker('end', arrowMarker);
    });
}

// Render explicit pointers
treeEdges.forEach(edge => {
    drawSiblings(explicitBaseGroup, edge.c);
    drawParentChild(explicitBaseGroup, edge.p, edge.c);
});
drawSiblings(explicitRootsIdleGroup, rootsIdle, true);
drawSiblings(explicitRootsInsertedGroup, rootsInserted, true);

// ─── DRAW NODES ─────────────────────────────────────────────────────────────
const nodeElements = {};

function createNode(id, data) {
    let g = nodesRenderGroup.group().attr('id', 'node-'+id).transform({translateX: data.x, translateY: data.y}).css('cursor', 'pointer');
    let bg = data.marked ? '#111' : '#e0e3e6';
    let fg = data.marked ? '#fff' : '#111';
    
    g.circle(32).cx(0).cy(0).fill(bg).stroke({color:'#111', width: 1.5});
    g.text(id).cx(0).cy(1).font({family:'sans-serif', size:14, anchor:'middle', weight: data.marked ? 'bold' : 'normal'}).fill(fg);
    
    g.on('mouseenter', (e) => showTooltip(`Node ${id} (Click to highlight pointers)`, e));
    g.on('mouseleave', () => hideTooltip());
    g.on('click', () => highlightPointers(id));
    
    nodeElements[id] = g;
}

Object.keys(nodesData).forEach(id => {
    createNode(id, nodesData[id]);
});
// Hide Node 2 initially
nodeElements['2'].opacity(0).transform({translateX: 280, translateY: 50});

// ─── H.MIN POINTER ──────────────────────────────────────────────────────────
const hMinG = draw.group().transform({translateX: 390, translateY: 75});
hMinG.text('H.min').font({family:'Times New Roman, serif', style:'italic', size:18}).cx(0).cy(-22);
hMinG.line(0, -6, 0, 48).stroke({width: 1.5, color: '#111'}).marker('end', arrowMarker);

// ─── INTERACTION LOGIC ──────────────────────────────────────────────────────
let isExplicit = false;
let insertState = 0; // 0=idle, 1=create, 2=splice, 3=update

function updateView() {
    isExplicit = document.getElementById('viewToggle_exp').checked;
    abstractGroup.animate(250).opacity(isExplicit ? 0 : 1);
    explicitGroup.animate(250).opacity(isExplicit ? 1 : 0);
    
    // Clear highlight on view toggle to avoid confusion
    highlightGroup.clear();
    currentHighlight = null;
}
window.updateView = updateView;

function updateInsert(stateIndex) {
    insertState = stateIndex;
    document.getElementById('insertSequenceInput').value = stateIndex;
    highlightGroup.clear();
    currentHighlight = null;
    
    switch (stateIndex) {
        case 0: // Idle
            nodeElements['2'].animate(300).opacity(0).transform({translateX: 280, translateY: 50});
            abstractRootsIdleLine.animate(300).opacity(1);
            abstractRootsInsertedLine.animate(300).opacity(0);
            explicitRootsIdleGroup.animate(300).opacity(1);
            explicitRootsInsertedGroup.animate(300).opacity(0);
            hMinG.animate(400).transform({translateX: 390, translateY: 75});
            break;
        case 1: // Create node
            nodeElements['2'].animate(300).opacity(1).transform({translateX: 280, translateY: 50});
            abstractRootsIdleLine.animate(300).opacity(1);
            abstractRootsInsertedLine.animate(300).opacity(0);
            explicitRootsIdleGroup.animate(300).opacity(1);
            explicitRootsInsertedGroup.animate(300).opacity(0);
            hMinG.animate(400).transform({translateX: 390, translateY: 75});
            break;
        case 2: // Splice to root list
            nodeElements['2'].animate(400).opacity(1).transform({translateX: 280, translateY: 150});
            abstractRootsIdleLine.animate(300).opacity(0);
            abstractRootsInsertedLine.animate(300).opacity(1);
            explicitRootsIdleGroup.animate(300).opacity(0);
            explicitRootsInsertedGroup.animate(300).opacity(1);
            hMinG.animate(400).transform({translateX: 390, translateY: 75});
            break;
        case 3: // Update H.min
            nodeElements['2'].animate(300).opacity(1).transform({translateX: 280, translateY: 150});
            abstractRootsIdleLine.opacity(0);
            abstractRootsInsertedLine.opacity(1);
            explicitRootsIdleGroup.opacity(0);
            explicitRootsInsertedGroup.opacity(1);
            hMinG.animate(400).transform({translateX: 280, translateY: 75});
            break;
    }
}
window.updateInsert = updateInsert;

// ─── POINTER HIGHLIGHT (CLICK INTERACTION) ──────────────────────────────────
let currentHighlight = null;
function highlightPointers(id) {
    if (id === '2' && insertState < 2) return; // Node 2 isn't spliced yet
    
    // Switch to explicit view to properly show pointers
    if (!isExplicit) {
        document.getElementById('viewToggle_exp').checked = true;
        updateView();
    }
    
    if (currentHighlight === id) {
        highlightGroup.clear();
        currentHighlight = null;
        hidePopup();
        return;
    }
    currentHighlight = id;
    highlightGroup.clear();
    
    let cNode = nodesData[id];
    let currentRoots = insertState >= 2 ? rootsInserted : rootsIdle;
    let list = null, parentId = null, childId = null;
    
    if (currentRoots.includes(id)) {
        list = currentRoots;
    } else {
        for (let edge of treeEdges) {
            if (edge.c.includes(id)) {
                list = edge.c;
                parentId = edge.p;
                break;
            }
        }
    }
    
    // Find first child if it exists
    let edgeChild = treeEdges.find(e => e.p === id);
    if (edgeChild) childId = edgeChild.c[0];
    
    // Draw highlights
    const r = 16;
    let desc = [`Explicit Pointers for Node ${id}:`];
    
    if (list) {
        let idx = list.indexOf(id);
        let len = list.length;
        let L = list[(idx - 1 + len) % len];
        let R = list[(idx + 1) % len];
        let nR = nodesData[R], nL = nodesData[L];
        
        // Right Sibling Pointer
        if (len > 1) {
            if (idx === len - 1) {
                 highlightGroup.path(`M ${cNode.x+12} ${cNode.y-10} Q ${cNode.x+26} ${cNode.y-20} ${cNode.x} ${cNode.y-20} L ${nR.x} ${nR.y-20} Q ${nR.x-26} ${nR.y-20} ${nR.x-12} ${nR.y-10}`).fill('none').stroke({width:3, color:'#d90000'}).marker('end', redArrowMarker);
            } else {
                 highlightGroup.line(cNode.x+r, cNode.y-4, nR.x-r-2, nR.y-4).stroke({width:3, color:'#d90000'}).marker('end', redArrowMarker);
            }
        } else {
            highlightGroup.path(`M ${cNode.x-8} ${cNode.y-15} C ${cNode.x-24} ${cNode.y-24}, ${cNode.x-24} ${cNode.y+24}, ${cNode.x-8} ${cNode.y+15}`).fill('none').stroke({width:3, color:'#d90000'}).marker('end', redArrowMarker);
        }
        desc.push(`• Right Sibling → Node ${R}`);
        
        // Left Sibling Pointer
        if (len > 1) {
            if (idx === 0) {
                 highlightGroup.path(`M ${cNode.x-12} ${cNode.y+10} Q ${cNode.x-26} ${cNode.y+20} ${cNode.x} ${cNode.y+20} L ${nL.x} ${nL.y+20} Q ${nL.x+26} ${nL.y+20} ${nL.x+12} ${nL.y+10}`).fill('none').stroke({width:3, color:'#d90000'}).marker('end', redArrowMarker);
            } else {
                 highlightGroup.line(cNode.x-r, cNode.y+4, nL.x+r+2, nL.y+4).stroke({width:3, color:'#d90000'}).marker('end', redArrowMarker);
            }
        } else {
            highlightGroup.path(`M ${cNode.x+8} ${cNode.y+15} C ${cNode.x+24} ${cNode.y+24}, ${cNode.x+24} ${cNode.y-24}, ${cNode.x+8} ${cNode.y-15}`).fill('none').stroke({width:3, color:'#d90000'}).marker('end', redArrowMarker);
        }
        desc.push(`• Left Sibling ← Node ${L}`);
    }
    
    // Parent Pointer
    if (parentId) {
        let pNode = nodesData[parentId];
        let pLineOffset = (Math.abs(pNode.x - cNode.x) < 5) ? 4 : 0;
        let [cx, cy, px, py] = getEdgeCoords(cNode.x + pLineOffset, cNode.y, pNode.x + pLineOffset, pNode.y, 16, 18);
        highlightGroup.line(cx, cy, px, py).stroke({width:3, color:'#d90000'}).marker('end', redArrowMarker);
        desc.push(`• Parent Pointer ↑ Node ${parentId}`);
    } else {
        desc.push(`• Parent Pointer ↑ (null - in root list)`);
    }
    
    // Child Pointer
    if (childId) {
        let chNode = nodesData[childId];
        let cLineOffset = (Math.abs(cNode.x - chNode.x) < 5) ? -4 : 0;
        let [px, py, cx, cy] = getEdgeCoords(cNode.x + cLineOffset, cNode.y, chNode.x + cLineOffset, chNode.y, 16, 18);
        highlightGroup.line(px, py, cx, cy).stroke({width:3, color:'#d90000'}).marker('end', redArrowMarker);
        desc.push(`• Child Pointer ↓ Node ${childId}`);
    } else {
        desc.push(`• Child Pointer ↓ (null)`);
    }
    
    showPopup(`Node ${id} Pointers`, desc.join('\n'));
}

// ─── DEMO STEPS PLAYER ──────────────────────────────────────────────────────
const steps = [
    {
      state: { view: 'Abstract tree', insert: 0 },
      narration: "Conceptually, a Fibonacci heap is a collection of min-heap-ordered trees. The roots are loosely connected, and an H.min pointer tracks the overall minimum element."
    },
    {
      state: { view: 'Explicit pointers', insert: 0 },
      narration: "In memory, this structure is implemented using circular doubly linked lists for both the root list and every sibling list, allowing constant-time list operations."
    },
    {
      state: { view: 'Explicit pointers', insert: 1 },
      narration: "To insert a new key (e.g., 2), we first allocate it as a new independent single-node tree."
    },
    {
      state: { view: 'Explicit pointers', insert: 2 },
      narration: "We then splice it into the doubly linked root list. Because it's a circular list, splicing only takes O(1) time."
    },
    {
      state: { view: 'Explicit pointers', insert: 3 },
      narration: "Finally, if the new node's key is smaller than the current H.min, we update the pointer. The heap property is maintained without any restructuring."
    }
];

let currentStep = 0;

function applyStep(idx) {
    let s = steps[idx];
    document.getElementById('demoNarration').textContent = s.narration;
    document.getElementById('stepLabel').textContent = `Step ${idx + 1} / ${steps.length}`;
    
    if (s.state.view === 'Abstract tree') {
        document.getElementById('viewToggle_abs').checked = true;
    } else {
        document.getElementById('viewToggle_exp').checked = true;
    }
    updateView();
    updateInsert(s.state.insert);
    
    document.getElementById('prevBtn').disabled = (idx === 0);
    document.getElementById('nextBtn').disabled = (idx === steps.length - 1);
    
    document.getElementById('prevBtn').style.opacity = (idx === 0) ? 0.5 : 1;
    document.getElementById('nextBtn').style.opacity = (idx === steps.length - 1) ? 0.5 : 1;
}

window.nextStep = function() {
    if (currentStep < steps.length - 1) {
        currentStep++;
        applyStep(currentStep);
    }
}

window.prevStep = function() {
    if (currentStep > 0) {
        currentStep--;
        applyStep(currentStep);
    }
}

// Initial draw sequence
applyStep(0);
window.__markRendered();
// @FIGURE_CODE_END
