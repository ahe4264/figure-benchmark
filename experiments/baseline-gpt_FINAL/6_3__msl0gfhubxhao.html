<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="font-weight:600">BUILD-MAX-HEAP workbench</span><br>
<span>Samples: </span><button onclick="loadSample('correct')">correct</button><button onclick="loadSample('buggy')">buggy</button><button onclick="loadSample('starter')">starter</button><br>
<label>Input array <input id="heapInput" value="4,1,3,2,16,9,10,14,8,7" style="width:100%;box-sizing:border-box"></label>
<textarea id="heapCode" spellcheck="false">function maxHeapify(i, heapSize) {
  let l = left(i);
  let r = right(i);
  let largest = i;

  if (l &lt;= heapSize &amp;&amp; value(l) &gt; value(largest)) {
    largest = l;
  }
  if (r &lt;= heapSize &amp;&amp; value(r) &gt; value(largest)) {
    largest = r;
  }
  if (largest !== i) {
    swap(i, largest);
    maxHeapify(largest, heapSize);
  }
}</textarea>
<button id="runBtn" onclick="runHeapCode()">Run BUILD-MAX-HEAP</button><br>
<span id="statusText">Status: not run</span><br>
<button onclick="firstFrame()">⏮</button><button onclick="prevFrame()">◀</button><button id="playBtn" onclick="togglePlay()">▶</button><button onclick="nextFrame()">▶</button><button onclick="lastFrame()">⏭</button>
<span id="frameCounter">static figure</span><br>
<label>Speed: <output id="speedVal">1</output><input id="speedInput" type="range" min="0.25" max="3" step="0.25" value="1" oninput="document.getElementById('speedVal').value=this.value"></label>
<span id="captionText">Edit maxHeapify, then run to replay every primitive operation.</span><br>
<textarea id="logText" readonly style="min-height:90px" aria-label="trace log"></textarea>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
// Library: svgjs
var draw = SVG().addTo(document.getElementById('container')).size('100%', '100%');
var VBW = 1000, VBH = 760;
draw.viewbox(0, 0, VBW, VBH);

var rootGroup = draw.group();
var frames = [];
var frameIndex = 0;
var playTimer = null;
var lastRunInput = [4, 1, 3, 2, 16, 9, 10, 14, 8, 7];
var samples = {
  correct:
`function maxHeapify(i, heapSize) {
  let l = left(i);
  let r = right(i);
  let largest = i;

  if (l <= heapSize && value(l) > value(largest)) {
    largest = l;
  }
  if (r <= heapSize && value(r) > value(largest)) {
    largest = r;
  }
  if (largest !== i) {
    swap(i, largest);
    maxHeapify(largest, heapSize);
  }
}`,
  buggy:
`function maxHeapify(i, heapSize) {
  // Bug: only compares the left child.
  let l = left(i);
  if (l <= heapSize && value(l) > value(i)) {
    swap(i, l);
  }
}`,
  starter:
`function maxHeapify(i, heapSize) {
  // Use left(i), right(i), value(i), and swap(i, j).
  // Put the largest of i and its children at i,
  // then continue sifting down if a swap happened.

}`
};

function loadSample(name) {
  document.getElementById('heapCode').value = samples[name] || samples.correct;
  document.getElementById('statusText').textContent = 'Status: sample loaded';
}

function parseArrayText() {
  var s = document.getElementById('heapInput').value.trim();
  if (!s) throw new Error('Input array is empty.');
  var a = s.split(/[\s,]+/).map(function (x) {
    var n = Number(x);
    if (!isFinite(n)) throw new Error('Input contains a non-number: ' + x);
    return n;
  });
  if (a.length < 1 || a.length > 31) throw new Error('Use 1 to 31 numbers so the tree remains readable.');
  return a;
}

function setStatus(txt) {
  document.getElementById('statusText').textContent = 'Status: ' + txt;
}

function clearPlayback() {
  if (playTimer) clearInterval(playTimer);
  playTimer = null;
  document.getElementById('playBtn').textContent = '▶';
}

function heapNodePos(i, ox, oy, sx, sy) {
  var level = Math.floor(Math.log(i) / Math.log(2));
  var first = Math.pow(2, level);
  var pos = i - first;
  var slots = Math.pow(2, level);
  var x = ox + sx * ((pos + 0.5) / slots);
  var y = oy + level * sy;
  return { x: x, y: y };
}

function drawArrayBar(g, arr, x, y, cell, activeIndices, badIndices) {
  activeIndices = activeIndices || [];
  badIndices = badIndices || [];
  var label = g.text('A').font({ family: 'serif', size: 22, style: 'italic' }).move(x - 26, y + 6);
  label.attr({ 'paint-order': 'stroke', stroke: '#fff', 'stroke-width': 3 });
  for (var i = 0; i < arr.length; i++) {
    var idx = i + 1;
    var fill = '#d9d9d9';
    if (badIndices.indexOf(idx) >= 0) fill = '#ffb6b6';
    else if (activeIndices.indexOf(idx) >= 0) fill = '#fff0aa';
    g.rect(cell, cell).move(x + i * cell, y).fill(fill).stroke({ color: '#000', width: 1 });
    g.text(String(arr[i])).font({ family: 'serif', size: 18, anchor: 'middle' })
      .center(x + i * cell + cell / 2, y + cell / 2 + 1);
  }
}

function drawTree(g, arr, opts) {
  opts = opts || {};
  var ox = opts.x || 0, oy = opts.y || 0, sx = opts.w || 420, sy = opts.sy || 58;
  var r = opts.r || 23;
  var active = opts.active || null;
  var touched = opts.touched || [];
  var bad = opts.bad || [];
  var arrowFrom = opts.arrowFrom || null;
  var arrowTo = opts.arrowTo || null;
  var label = opts.label || '';
  var showI = opts.showI !== false;
  var n = arr.length;

  for (var i = 2; i <= n; i++) {
    var p = Math.floor(i / 2);
    var a = heapNodePos(p, ox, oy, sx, sy);
    var b = heapNodePos(i, ox, oy, sx, sy);
    g.line(a.x, a.y, b.x, b.y).stroke({ color: '#000', width: 1.3 });
  }

  if (arrowFrom && arrowTo && arrowTo <= n) {
    var af = heapNodePos(arrowFrom, ox, oy, sx, sy);
    var at = heapNodePos(arrowTo, ox, oy, sx, sy);
    var dx = at.x - af.x, dy = at.y - af.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
    var x1 = af.x + dx * (r + 4) / len, y1 = af.y + dy * (r + 4) / len;
    var x2 = at.x - dx * (r + 6) / len, y2 = at.y - dy * (r + 6) / len;
    var line = g.line(x1, y1, x2, y2).stroke({ color: '#c54b39', width: 2.2, linecap: 'round' });
    line.marker('end', 8, 8, function (add) {
      add.path('M0,0 L8,4 L0,8 z').fill('#c54b39');
    });
  }

  for (var j = 1; j <= n; j++) {
    var pt = heapNodePos(j, ox, oy, sx, sy);
    var fill = '#e6e6e6';
    if (bad.indexOf(j) >= 0) fill = '#ffb6b6';
    else if (active === j) fill = '#9a9a9a';
    else if (touched.indexOf(j) >= 0) fill = '#fff0aa';

    var node = g.circle(2 * r).center(pt.x, pt.y).fill(fill).stroke({ color: '#000', width: 1.1 });
    node.css('cursor', 'pointer')
      .on('mousemove', (function (idx, val) {
        return function (e) { showTooltip('index ' + idx + ', value ' + val, e); };
      })(j, arr[j - 1]))
      .on('mouseleave', function () { hideTooltip(); })
      .on('click', (function (idx, val) {
        return function () {
          showPopup('Heap node ' + idx, 'This circle represents A[' + idx + '] = ' + val + '. In a max-heap, every parent value must be at least as large as each child value.');
        };
      })(j, arr[j - 1]));

    g.text(String(arr[j - 1])).font({ family: 'serif', size: opts.valueSize || 21, anchor: 'middle' })
      .center(pt.x, pt.y + 1);

    var lab = g.text(String(j)).font({ family: 'serif', size: opts.indexSize || 14, anchor: 'middle' });
    lab.center(pt.x, pt.y - r - 12);
    lab.attr({ 'paint-order': 'stroke', stroke: '#fff', 'stroke-width': 3, 'stroke-linejoin': 'round' });
  }

  if (active && showI) {
    var ip = heapNodePos(active, ox, oy, sx, sy);
    var tx = ip.x - r - 18;
    var ty = ip.y - 6;
    if (active === 3 || active === 5) tx = ip.x + r + 10;
    if (active === 1) tx = ip.x - r - 26;
    var it = g.text('i').font({ family: 'serif', size: opts.iSize || 18, style: 'italic' }).move(tx, ty);
    it.attr({ 'paint-order': 'stroke', stroke: '#fff', 'stroke-width': 3, 'stroke-linejoin': 'round' });
  }

  if (label) {
    g.text(label).font({ family: 'serif', size: opts.panelLabelSize || 20, anchor: 'middle' })
      .center(ox + sx / 2, oy + (opts.labelY || 198));
  }
}

function drawStaticFigure() {
  rootGroup.clear();
  var g = rootGroup.group();
  drawArrayBar(g, [4, 1, 3, 2, 16, 9, 10, 14, 8, 7], 86, 10, 35);

  var states = [
    { a: [4, 1, 3, 2, 16, 9, 10, 14, 8, 7], i: 5, lab: '(a)' },
    { a: [4, 1, 3, 2, 16, 9, 10, 14, 8, 7], i: 4, lab: '(b)' },
    { a: [4, 1, 3, 14, 16, 9, 10, 2, 8, 7], i: 3, lab: '(c)' },
    { a: [4, 1, 10, 14, 16, 9, 3, 2, 8, 7], i: 2, lab: '(d)' },
    { a: [4, 16, 10, 14, 7, 9, 3, 2, 8, 1], i: 1, lab: '(e)' },
    { a: [16, 14, 10, 8, 7, 9, 3, 2, 4, 1], i: null, lab: '(f)' }
  ];
  var origins = [
    [30, 95], [530, 95],
    [30, 315], [530, 315],
    [30, 535], [530, 535]
  ];
  for (var k = 0; k < states.length; k++) {
    drawTree(g, states[k].a, {
      x: origins[k][0], y: origins[k][1],
      w: 410, sy: 54, r: 22,
      active: states[k].i,
      label: states[k].lab,
      labelY: 190,
      valueSize: 20,
      indexSize: 14,
      iSize: 17
    });
  }
  document.getElementById('captionText').textContent = 'Static view: the six textbook states from i = 5 down to the finished heap.';
  document.getElementById('frameCounter').textContent = 'static figure';
  document.getElementById('logText').value = '';
}

function violatingIndices(arr) {
  var bad = [];
  for (var i = 1; i <= arr.length; i++) {
    var l = 2 * i, r = 2 * i + 1;
    if (l <= arr.length && arr[i - 1] < arr[l - 1]) {
      if (bad.indexOf(i) < 0) bad.push(i);
      if (bad.indexOf(l) < 0) bad.push(l);
    }
    if (r <= arr.length && arr[i - 1] < arr[r - 1]) {
      if (bad.indexOf(i) < 0) bad.push(i);
      if (bad.indexOf(r) < 0) bad.push(r);
    }
  }
  return bad;
}

function sameMultiset(a, b) {
  if (a.length !== b.length) return false;
  var x = a.slice().sort(function (m, n) { return m - n; });
  var y = b.slice().sort(function (m, n) { return m - n; });
  for (var i = 0; i < x.length; i++) if (x[i] !== y[i]) return false;
  return true;
}

function drawFrame() {
  if (!frames.length) {
    drawStaticFigure();
    return;
  }
  rootGroup.clear();
  var fr = frames[frameIndex];
  var arr = fr.state || lastRunInput;
  var bad = fr.bad || [];
  var touched = fr.indices || [];
  var active = fr.root || null;
  var arrowTo = null;
  if (fr.kind === 'value' && active && touched.length && touched[0] !== active) arrowTo = touched[0];

  var g = rootGroup.group();
  drawArrayBar(g, arr, 230, 25, 42, touched, bad);
  drawTree(g, arr, {
    x: 180, y: 150, w: 640, sy: 105, r: 34,
    active: active,
    touched: touched,
    bad: bad,
    arrowFrom: active,
    arrowTo: arrowTo,
    showI: !!active,
    valueSize: 30,
    indexSize: 18,
    iSize: 24
  });

  var note = fr.message || '';
  var box = g.rect(720, 38).move(140, 700).fill({ color: '#fff', opacity: 0.86 }).stroke({ color: '#bbb', width: 1 });
  var txt = g.text(note).font({ family: 'sans-serif', size: 16, anchor: 'middle' }).center(500, 719);
  txt.attr({ 'paint-order': 'stroke', stroke: '#fff', 'stroke-width': 3 });

  document.getElementById('captionText').textContent = note;
  document.getElementById('frameCounter').textContent = (frameIndex + 1) + ' of ' + frames.length;
  var start = Math.max(0, frameIndex - 8);
  var lines = [];
  for (var i = start; i <= frameIndex; i++) lines.push((i + 1) + '. ' + (frames[i].message || frames[i].kind));
  document.getElementById('logText').value = lines.join('\n');
}

function firstFrame() {
  clearPlayback();
  if (frames.length) { frameIndex = 0; drawFrame(); }
}
function prevFrame() {
  clearPlayback();
  if (frames.length) { frameIndex = Math.max(0, frameIndex - 1); drawFrame(); }
}
function nextFrame() {
  if (frames.length) {
    frameIndex = Math.min(frames.length - 1, frameIndex + 1);
    drawFrame();
    if (frameIndex === frames.length - 1) clearPlayback();
  }
}
function lastFrame() {
  clearPlayback();
  if (frames.length) { frameIndex = frames.length - 1; drawFrame(); }
}
function togglePlay() {
  if (!frames.length) return;
  if (playTimer) {
    clearPlayback();
    return;
  }
  document.getElementById('playBtn').textContent = '⏸';
  playTimer = setInterval(function () {
    var speed = Number(document.getElementById('speedInput').value) || 1;
    if (frameIndex >= frames.length - 1) {
      clearPlayback();
    } else {
      frameIndex++;
      drawFrame();
    }
    if (playTimer) {
      clearInterval(playTimer);
      playTimer = setInterval(arguments.callee, Math.max(70, 550 / speed));
    }
  }, Math.max(70, 550 / (Number(document.getElementById('speedInput').value) || 1)));
}

function makeWorkerSource(code, inputArr) {
  return `
var A = [null].concat(${JSON.stringify(inputArr)});
var original = ${JSON.stringify(inputArr)};
var heapSizeGlobal = A.length - 1;
var frames = [];
var opCount = 0;
var frameCap = 1200;
var opCap = 2000;
var currentRoot = null;

function copyState(){ return A.slice(1); }
function fail(msg){
  frames.push({kind:'error', state:copyState(), indices:[], root:currentRoot, error:true, message:msg});
  postMessage({ok:false, frames:frames, message:msg});
}
function append(kind, indices, message){
  opCount++;
  if (opCount > opCap || frames.length > frameCap) throw new Error('Operation/frame cap reached. Check for infinite recursion or a missing base case.');
  frames.push({kind:kind, state:copyState(), indices:(indices || []).slice(), root:currentRoot, message:message});
}
function checkIndex(i, name){
  if (!Number.isInteger(i) || i < 1 || i > heapSizeGlobal) throw new Error(name + ': index ' + i + ' is outside 1..' + heapSizeGlobal);
}
function left(i){
  checkIndex(i, 'left');
  var ans = 2 * i;
  append('left', [i], 'left(' + i + ') returns ' + ans);
  return ans;
}
function right(i){
  checkIndex(i, 'right');
  var ans = 2 * i + 1;
  append('right', [i], 'right(' + i + ') returns ' + ans);
  return ans;
}
function value(i){
  checkIndex(i, 'value');
  append('value', [i], 'value(' + i + ') is ' + A[i]);
  return A[i];
}
function swap(i, j){
  checkIndex(i, 'swap');
  checkIndex(j, 'swap');
  append('swap-before', [i, j], 'swap(' + i + ', ' + j + ') will exchange ' + A[i] + ' and ' + A[j]);
  var t = A[i]; A[i] = A[j]; A[j] = t;
  append('swap-after', [i, j], 'after swap: A[' + i + ']=' + A[i] + ', A[' + j + ']=' + A[j]);
}
Object.freeze(left); Object.freeze(right); Object.freeze(value); Object.freeze(swap);

try {
  var maxHeapify = (function(){
${code}
    return (typeof maxHeapify === 'function') ? maxHeapify : null;
  })();
  if (typeof maxHeapify !== 'function') throw new Error('Define a function named maxHeapify(i, heapSize).');
  append('initial', [], 'initial array before BUILD-MAX-HEAP');
  var n = heapSizeGlobal;
  for (var i = Math.floor(n / 2); i >= 1; i--) {
    currentRoot = i;
    append('call', [i], 'call maxHeapify(' + i + ', ' + n + ')');
    maxHeapify(i, n);
    append('return', [i], 'return from maxHeapify(' + i + ', ' + n + ')');
  }
  currentRoot = null;
  append('done', [], 'BUILD-MAX-HEAP finished');
  postMessage({ok:true, frames:frames, final:A.slice(1), original:original});
} catch (e) {
  fail((e && e.message) ? e.message : String(e));
}`;
}

function runHeapCode() {
  clearPlayback();
  var btn = document.getElementById('runBtn');
  btn.disabled = true;
  setStatus('running');
  document.getElementById('logText').value = '';
  var code = document.getElementById('heapCode').value;
  var arr;
  try {
    arr = parseArrayText();
    lastRunInput = arr.slice();
  } catch (e) {
    frames = [{ kind: 'error', state: lastRunInput.slice(), error: true, message: e.message, indices: [] }];
    frameIndex = 0;
    setStatus('error');
    drawFrame();
    btn.disabled = false;
    return;
  }

  var blob = new Blob([makeWorkerSource(code, arr)], { type: 'application/javascript' });
  var url = URL.createObjectURL(blob);
  var worker = new Worker(url);
  var done = false;
  var timeout = setTimeout(function () {
    if (done) return;
    done = true;
    worker.terminate();
    URL.revokeObjectURL(url);
    frames = [{
      kind: 'timeout',
      state: arr.slice(),
      indices: [],
      error: true,
      message: 'Timed out. The heapify code may have an infinite loop or recursion.'
    }];
    frameIndex = 0;
    setStatus('error: timeout');
    drawFrame();
    btn.disabled = false;
  }, 1800);

  worker.onmessage = function (ev) {
    if (done) return;
    done = true;
    clearTimeout(timeout);
    worker.terminate();
    URL.revokeObjectURL(url);
    frames = ev.data.frames || [];
    if (!frames.length) frames = [{ kind: 'empty', state: arr.slice(), message: 'No trace frames were produced.', indices: [] }];

    var finalState = frames[frames.length - 1].state || arr.slice();
    var bad = violatingIndices(finalState);
    var permOK = sameMultiset(arr, finalState);
    if (ev.data.ok && bad.length === 0 && permOK) {
      frames.push({ kind: 'success', state: finalState.slice(), indices: [], root: null, message: 'Correct: the final array satisfies the max-heap property.' });
      setStatus('correct');
    } else if (ev.data.ok) {
      var msg = permOK ? 'Wrong answer: highlighted parent/child nodes violate the max-heap property.' : 'Wrong answer: the final array is not a permutation of the input.';
      frames.push({ kind: 'wrong', state: finalState.slice(), indices: bad, bad: bad, root: null, message: msg });
      setStatus('wrong answer');
    } else {
      setStatus('error');
    }

    frameIndex = 0;
    drawFrame();
    btn.disabled = false;
  };

  worker.onerror = function (e) {
    if (done) return;
    done = true;
    clearTimeout(timeout);
    worker.terminate();
    URL.revokeObjectURL(url);
    frames = [{ kind: 'error', state: arr.slice(), indices: [], error: true, message: e.message || 'Worker error' }];
    frameIndex = 0;
    setStatus('error');
    drawFrame();
    btn.disabled = false;
  };
}

drawStaticFigure();
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
</body>
