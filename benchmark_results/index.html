<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bradley-Terry Rankings</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%231D4ED8'/><rect x='3' y='9' width='2.5' height='4' fill='white'/><rect x='6.75' y='6' width='2.5' height='7' fill='white'/><rect x='10.5' y='3' width='2.5' height='10' fill='white'/></svg>">
  <link rel="stylesheet" href="bt.css">
</head>

<body>
  <div class="wrap">

    <header>
      <h1>Bradley-Terry Rankings</h1>
      <div class="sub">Fitted live from the pairwise result files in this folder.</div>
      <div class="status" id="status" style="display:none"></div>
    </header>

    <div id="picker">
      <h2>Choose the results folder</h2>
      <p>Pick the <strong>figure-bench</strong> folder (the folder this file is in).</p>
      <button id="pick-btn" type="button">Choose folder…</button>
      <input type="file" id="folder-input" webkitdirectory directory multiple>
      <div id="picker-note"></div>
    </div>

    <div id="panel" style="display:none">
      <div class="card">
        <div class="card-head">
          <span class="card-title">Rankings</span>
          <button class="link" id="reload-btn" type="button">Reload results</button>
        </div>
        <div id="controls"></div>
      </div>

      <div class="card">
        <div id="tables"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <span class="card-title">Pair Results</span>
          <span class="card-sub" id="pair-source"></span>
        </div>
        <div id="pair-controls"></div>
        <div id="pair-body"></div>
      </div>
    </div>

  </div>
  <script src="bt.js"></script>
</body>

</html>
